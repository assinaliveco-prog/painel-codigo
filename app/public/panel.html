<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Código de acesso</title>
<style>
  :root {
    color-scheme: light dark;

    /* light (padrao) — neutros mornos, sem branco/preto puro */
    --bg: oklch(0.972 0.006 85);
    --surface: oklch(0.995 0.003 85);
    --surface-2: oklch(0.955 0.006 85);
    --border: oklch(0.905 0.006 85);
    --ink: oklch(0.27 0.012 70);
    --muted: oklch(0.56 0.012 75);
    --faint: oklch(0.72 0.01 80);

    --fresh: oklch(0.60 0.14 150);
    --aging: oklch(0.66 0.13 70);
    --expired: oklch(0.57 0.17 25);

    --shadow: 0 1px 2px oklch(0.5 0.02 80 / 0.06), 0 12px 30px oklch(0.5 0.02 80 / 0.07);
    --radius: 22px;

    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: oklch(0.215 0.012 75);
      --surface: oklch(0.262 0.012 75);
      --surface-2: oklch(0.305 0.013 75);
      --border: oklch(0.345 0.012 75);
      --ink: oklch(0.96 0.006 85);
      --muted: oklch(0.74 0.012 80);
      --faint: oklch(0.58 0.012 78);

      --fresh: oklch(0.74 0.15 150);
      --aging: oklch(0.80 0.13 78);
      --expired: oklch(0.68 0.17 25);

      --shadow: 0 1px 2px oklch(0 0 0 / 0.3), 0 14px 34px oklch(0 0 0 / 0.34);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    padding: max(20px, env(safe-area-inset-top)) 18px 32px;
  }
  .app { width: 100%; max-width: 440px; }

  /* topo */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 22px;
  }
  .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .mark {
    flex: none;
    width: 38px; height: 38px;
    border-radius: 11px;
    background: var(--surface);
    border: 1px solid var(--border);
    display: grid; place-items: center;
    color: var(--ink);
    box-shadow: var(--shadow);
  }
  .mark svg { width: 19px; height: 19px; }
  .brand-text { display: flex; flex-direction: column; min-width: 0; }
  .brand-name {
    font-size: 15px; font-weight: 600; letter-spacing: -0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .brand-sub { font-size: 12.5px; color: var(--muted); }

  .live {
    flex: none;
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--muted);
    padding: 5px 10px 5px 9px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
  }
  .live-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--faint);
    box-shadow: 0 0 0 0 transparent;
  }
  .live.on .live-dot { background: var(--fresh); animation: ping 2.4s ease-out infinite; }
  .live.off .live-dot { background: var(--expired); }
  @keyframes ping {
    0% { box-shadow: 0 0 0 0 var(--fresh); opacity: 1; }
    70%, 100% { box-shadow: 0 0 0 6px transparent; opacity: 1; }
  }

  /* cartao do codigo */
  .codecard {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 20px 20px;
    overflow: hidden;
    transition: box-shadow .4s cubic-bezier(.22,1,.36,1);
  }
  .codecard.flash { box-shadow: var(--shadow), 0 0 0 3px var(--fresh); }

  .status {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 500; color: var(--muted);
  }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .codecard[data-state="fresh"] .status { color: var(--fresh); }
  .codecard[data-state="fresh"] .status-dot { background: var(--fresh); }
  .codecard[data-state="aging"] .status { color: var(--aging); }
  .codecard[data-state="aging"] .status-dot { background: var(--aging); }
  .codecard[data-state="expired"] .status { color: var(--expired); }
  .codecard[data-state="expired"] .status-dot { background: var(--expired); }

  .code-btn {
    appearance: none;
    width: 100%;
    margin: 14px 0 4px;
    padding: 8px 4px 10px;
    background: transparent;
    border: 0;
    border-radius: 14px;
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    color: inherit;
    transition: background .15s ease;
  }
  .code-btn:disabled { cursor: default; }
  .code-btn:not(:disabled):hover { background: var(--surface-2); }
  .code-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .code {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-weight: 680;
    font-size: clamp(48px, 16vw, 64px);
    line-height: 1;
    letter-spacing: 0.1em;
    text-indent: 0.1em; /* compensa o tracking do ultimo digito */
    color: var(--ink);
  }
  .codecard[data-state="empty"] .code { color: var(--faint); font-weight: 500; letter-spacing: 0.18em; }

  .copy-hint { font-size: 12.5px; color: var(--muted); height: 16px; }
  .copy-hint.done { color: var(--fresh); font-weight: 600; }

  /* barra de frescor */
  .bar {
    height: 5px; border-radius: 999px;
    background: var(--surface-2);
    overflow: hidden;
    margin-top: 8px;
  }
  .bar-fill {
    height: 100%; width: 0%;
    background: var(--faint);
    border-radius: 999px;
    transition: width 1s linear, background .4s ease;
  }
  .codecard[data-state="fresh"] .bar-fill { background: var(--fresh); }
  .codecard[data-state="aging"] .bar-fill { background: var(--aging); }
  .codecard[data-state="expired"] .bar-fill { background: var(--expired); }
  .codecard[data-state="empty"] .bar { visibility: hidden; }

  /* anteriores */
  .history { margin-top: 26px; }
  .history h2 {
    font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 6px; padding: 0 4px;
  }
  .history ul { list-style: none; margin: 0; padding: 0; }
  .history li { border-bottom: 1px solid var(--border); }
  .history li:last-child { border-bottom: 0; }
  .hrow {
    width: 100%; appearance: none; background: transparent; border: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 13px 6px;
    color: var(--ink);
    border-radius: 10px;
    transition: background .15s ease;
  }
  .hrow:hover { background: var(--surface-2); }
  .hrow:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
  .hrow .hc { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 18px; letter-spacing: 0.08em; }
  .hrow .ha { font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; }

  footer {
    margin-top: 24px; padding: 0 4px;
    font-size: 11.5px; color: var(--faint); line-height: 1.5;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2.5l7 3v5.5c0 4.4-3 7.7-7 9-4-1.3-7-4.6-7-9V5.5l7-3z"/>
          <path d="M8.6 12l2.2 2.2 4.6-4.6"/>
        </svg>
      </span>
      <div class="brand-text">
        <span class="brand-name">{{ACCOUNT_LABEL}}</span>
        <span class="brand-sub">Código de acesso</span>
      </div>
    </div>
    <div class="live" id="live">
      <span class="live-dot"></span>
      <span id="liveText">conectando</span>
    </div>
  </header>

  <main>
    <section class="codecard" id="card" data-state="empty">
      <div class="status" aria-live="polite">
        <span class="status-dot"></span>
        <span id="status">Aguardando o próximo código…</span>
      </div>

      <button class="code-btn" id="codeBtn" type="button" disabled aria-label="Copiar código">
        <span class="code" id="code" aria-live="polite">·······</span>
        <span class="copy-hint" id="copyHint"></span>
      </button>

      <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    </section>

    <section class="history" id="historyWrap" hidden>
      <h2>Anteriores</h2>
      <ul id="recent"></ul>
    </section>
  </main>

  <footer>
    O código aparece aqui sozinho, segundos depois de chegar. Use só para entrar.
  </footer>
</div>

<script>
(function () {
  var base = location.pathname.replace(/\/+$/, '');
  var API = base + '/latest';

  var WINDOW = 300; // janela visual de validade (s) — apenas referencia

  var el = {
    card: document.getElementById('card'),
    code: document.getElementById('code'),
    status: document.getElementById('status'),
    codeBtn: document.getElementById('codeBtn'),
    copyHint: document.getElementById('copyHint'),
    barFill: document.getElementById('barFill'),
    history: document.getElementById('historyWrap'),
    recent: document.getElementById('recent'),
    live: document.getElementById('live'),
    liveText: document.getElementById('liveText')
  };

  var data = null;       // ultimo payload
  var offset = 0;        // serverTime - clientTime
  var lastCode = null;
  var current = null;
  var copyTimer = null;

  function now() { return Date.now() + offset; }

  function ageOf(iso) { return (now() - new Date(iso).getTime()) / 1000; }

  function fmtAge(sec) {
    sec = Math.max(0, Math.floor(sec));
    if (sec < 10) return 'chegou agora';
    if (sec < 60) return 'há ' + sec + 's';
    var m = Math.floor(sec / 60);
    return 'há ' + m + (m === 1 ? ' min' : ' min');
  }

  el.codeBtn.addEventListener('click', function () { copy(current, el.copyHint); });

  function copy(value, hintEl) {
    if (!value) return;
    var done = function () {
      if (copyTimer) clearTimeout(copyTimer);
      hintEl.textContent = 'Copiado ✓';
      hintEl.classList.add('done');
      copyTimer = setTimeout(function () {
        hintEl.classList.remove('done');
        hintEl.textContent = current ? 'toque para copiar' : '';
      }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(value).then(done).catch(function () {
        hintEl.textContent = 'selecione e copie';
      });
    } else {
      hintEl.textContent = 'selecione e copie';
    }
  }

  function stateFor(age) {
    if (age < 120) return 'fresh';
    if (age < WINDOW) return 'aging';
    return 'expired';
  }

  function render() {
    if (!data) return;
    var latest = data.latest;

    if (!latest) {
      el.card.dataset.state = 'empty';
      el.code.textContent = '·······';
      el.status.textContent = 'Aguardando o próximo código…';
      el.codeBtn.disabled = true;
      el.copyHint.textContent = '';
      el.barFill.style.width = '0%';
      el.history.hidden = true;
      current = null;
      return;
    }

    current = latest.code;
    el.codeBtn.disabled = false;
    el.code.textContent = latest.code;
    if (!el.copyHint.classList.contains('done')) el.copyHint.textContent = 'toque para copiar';

    var age = ageOf(latest.receivedAt);
    var st = stateFor(age);
    el.card.dataset.state = st;

    var suffix = st === 'fresh' ? '' : (st === 'aging' ? ' · pode expirar' : ' · provavelmente expirado, peça outro');
    el.status.textContent = fmtAge(age) + suffix;

    var remaining = Math.max(0, 1 - age / WINDOW);
    el.barFill.style.width = (remaining * 100).toFixed(1) + '%';

    if (lastCode !== latest.code) {
      lastCode = latest.code;
      el.card.classList.remove('flash');
      void el.card.offsetWidth; // reinicia a animacao
      el.card.classList.add('flash');
      setTimeout(function () { el.card.classList.remove('flash'); }, 1200);
    }

    // anteriores (pula o atual)
    var rest = (data.recent || []).filter(function (c) { return c.receivedAt !== latest.receivedAt; }).slice(0, 4);
    if (rest.length) {
      el.history.hidden = false;
      var html = '';
      for (var i = 0; i < rest.length; i++) {
        var c = rest[i];
        html += '<li><button class="hrow" type="button" data-code="' + c.code + '">' +
                '<span class="hc">' + c.code + '</span>' +
                '<span class="ha">' + fmtAge(ageOf(c.receivedAt)) + '</span>' +
                '</button></li>';
      }
      el.recent.innerHTML = html;
    } else {
      el.history.hidden = true;
    }
  }

  el.recent.addEventListener('click', function (e) {
    var btn = e.target.closest('.hrow');
    if (!btn) return;
    var hint = btn.querySelector('.ha');
    copy(btn.getAttribute('data-code'), hint);
  });

  function setLive(state) {
    el.live.className = 'live ' + state;
    el.liveText.textContent = state === 'on' ? 'ao vivo' : (state === 'off' ? 'reconectando' : 'conectando');
  }

  function fetchLatest() {
    fetch(API, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function (d) {
        data = d;
        if (d.serverTime) offset = new Date(d.serverTime).getTime() - Date.now();
        setLive('on');
        render();
      })
      .catch(function () { setLive('off'); });
  }

  fetchLatest();
  setInterval(fetchLatest, 3000); // busca dados
  setInterval(render, 1000);      // atualiza idade/barra suave
})();
</script>
</body>
</html>
